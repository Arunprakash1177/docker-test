<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Checklist</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #f4f6f8; color: #222; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; border-radius: 4px; }
    li.done span { text-decoration: line-through; color: #777; }
    li span { flex: 1; }
  </style>
</head>
<body>
  <h1>Server Checklist</h1>
  <form id="form">
    <input type="text" id="title" placeholder="e.g. Patch web-01" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const tasks = await (await fetch("/api/tasks")).json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = t.done;
        cb.onchange = async () => { await fetch("/api/tasks/" + t.id, { method: "PATCH" }); load(); };
        const span = document.createElement("span");
        span.textContent = t.title;
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = async () => { await fetch("/api/tasks/" + t.id, { method: "DELETE" }); load(); };
        li.append(cb, span, del);
        list.appendChild(li);
      }
    }
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      await fetch("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: input.value }) });
      input.value = "";
      load();
    };
    load();
  </script>
</body>
</html>
